# Allow-list of Monitored Chats for the daily Digest.
#
# Only chat_id is needed — the human-readable title is read from the Message
# Store (chats.title in the scraper's PostgreSQL). The title comments below are
# just for humans reading this file.
#
# hashtag (optional) is the industry tag the Digest puts on this chat's themes,
# so readers can follow one product group through channel search. The set of
# hashtags here is closed: the Digest may use no other. Chats spanning several
# industries carry none.
#
# The Message Store is shared with a general-purpose scraper, so this explicit
# allow-list is what keeps unrelated chats out of the markirovka Digest.

[settings]
min_message_length = 30    # skip messages shorter than this (noise: "+1", "ок")

# The Digest Channel we publish to. Telegram auto-forwards its posts into the
# linked Monitored Chat, so they must be excluded from the Digest input — see
# the invariant under "Digest Channel" in CONTEXT.md. Kept separate from
# TELEGRAM_DIGEST_CHAT_ID, which is an addressing string and may be an
# @username; only the numeric id can be matched against the Message Store.
digest_channel_id = -1001383199989   # Маркировка. Дайджест

[[channels]]
chat_id = -1001205001393   # Маркировка. Главный чат

[[channels]]
chat_id = -1001359438834   # Маркировка. Молоко
hashtag = "#молоко"

[[channels]]
chat_id = -1001329208283   # Маркировка. Легпром и обувь
hashtag = "#легпром"

[[channels]]
chat_id = -1002202471035   # Маркировка. Электроника
hashtag = "#электроника"

[[channels]]
chat_id = -1001388762634   # Маркировка. Техно-чат
